[project]
name = "cvelistv5-fetcher"
version = "0.1.0"
description = "Fetch CVE Program 5.0 records into a local database with a search dashboard"
authors = [{ name = "Florian Fischer", email = "oss@bitfischer.de" }]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "cyclonedx-bom>=7.4"]

[project.scripts]
cvelistv5-fetch = "app.fetch:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
