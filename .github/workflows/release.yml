name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: cvelistv5-fetcher-linux
            build_name: cvelistv5-fetcher
            data_sep: ":"
          - os: windows-latest
            asset_name: cvelistv5-fetcher-windows.exe
            build_name: cvelistv5-fetcher.exe
            data_sep: ";"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e . pyinstaller

      - name: Build executable
        run: >
          pyinstaller --onefile --name cvelistv5-fetcher
          --paths .
          --add-data "web${{ matrix.data_sep }}web"
          --hidden-import uvicorn.logging
          --hidden-import uvicorn.loops.auto
          --hidden-import uvicorn.protocols.http.auto
          --hidden-import uvicorn.protocols.websockets.auto
          --hidden-import uvicorn.lifespan.on
          packaging/launcher.py

      - name: Rename artifact
        shell: bash
        run: mv "dist/${{ matrix.build_name }}" "${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/cvelistv5-fetcher-linux
            artifacts/cvelistv5-fetcher-windows.exe
          generate_release_notes: true
